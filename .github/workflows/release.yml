name: Release

# Changesets drives this. A PR that touches packages/catalog or packages/cli
# should carry a `.changeset/*.md` file (via `pnpm changeset`). On merge to
# main, this workflow either opens a "Version Packages" PR bundling the
# pending changesets, or, once that PR is merged, publishes the resulting
# version bump to npm and cuts a GitHub Release. The website is not part of
# this flow: apps/web is unversioned and deploys separately via Vercel.
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

      - name: Create Version PR or publish to npm
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # id-token: write above lets npm attach a signed provenance
          # attestation instead of just publishing blind.
          NPM_CONFIG_PROVENANCE: "true"
