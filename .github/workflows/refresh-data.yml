name: Refresh Baseline data

# Browser support moves monthly, so the snapshot is regenerated on a schedule
# and opened as a pull request. Nothing lands without a human reading the diff:
# a support change is exactly the kind of thing worth seeing before it ships.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Both snapshots read from these, so both are updated before anything is
      # regenerated: web-features for the Baseline tiers, browser-compat-data
      # for the member-level versions behind every {{browser:...}} claim.
      - run: pnpm update web-features --latest
      - run: pnpm update @mdn/browser-compat-data --latest

      # Before the refresh, while the committed snapshot is still the old
      # state and web-features on disk is already the new one. This is the
      # only moment the two disagree, so it is the only moment the comparison
      # means anything.
      - name: Report Baseline tier changes
        id: tiers
        # A report, never a gate. If this crashes the refresh PR should still
        # open; a missing summary is worth far less than a blocked refresh.
        continue-on-error: true
        # Captured first, then written. Writing the heredoc inline meant a
        # non-zero exit aborted between the opening delimiter and the closing
        # one, so the failure surfaced as a malformed-output parse error
        # instead of whatever the script actually said.
        run: |
          report="$(pnpm --silent check:tiers)"
          {
            echo 'report<<TIERS_EOF'
            echo "$report"
            echo TIERS_EOF
          } >> "$GITHUB_OUTPUT"

      - run: pnpm refresh:baseline

      # bundlephobia is a third-party service and it goes down. A refresh that
      # got the tiers right is worth opening without it, so this step is
      # allowed to fail: refresh:sizes keeps the previous measurement for any
      # package it could not reach, and exits non-zero only if one is lost.
      - run: pnpm refresh:sizes
        continue-on-error: true

      # A tier change re-renders the skill's catalog reference, since it prints
      # a support label per rule. Without this the PR is born stale and
      # check:freshness rejects the one PR whose whole purpose is a tier change.
      - run: pnpm refresh:guides
      - run: pnpm refresh:support
      - run: pnpm refresh:skill

      # Run the gates here rather than trusting the PR to be checked. A PR
      # opened with the default GITHUB_TOKEN does not trigger workflows, so
      # ci.yml may never run on this branch at all.
      - run: pnpm verify

      - uses: peter-evans/create-pull-request@v7
        with:
          title: "Refresh Baseline and bundle size snapshots"
          commit-message: "chore: refresh Baseline and bundle size snapshots"
          branch: chore/refresh-data
          body: |
            Regenerated from the latest `web-features` and bundlephobia.

            ${{ steps.tiers.outputs.report }}

            A rule leaving limited availability is the one worth a post: its
            first condition currently tells readers they still need a
            fallback, and that sentence is now wrong.
